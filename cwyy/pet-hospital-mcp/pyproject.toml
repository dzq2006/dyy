[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "MCP Server for Pet Hospital REST API (2026-07-28 protocol)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
